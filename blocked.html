<!DOCTYPE html>

<html>
<head>

<meta charset="UTF-8">

<title>THEREAT AI - Website Blocked</title>

<style>

body {
    margin: 0;
    background: #080b12;
    color: white;
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
}

.card {
    width: 650px;
    padding: 45px;
    background: #111722;
    border-radius: 20px;
    text-align: center;
    box-shadow: 0 0 40px rgba(255, 50, 50, 0.15);
}

.icon {
    font-size: 70px;
}

h1 {
    color: #ff5252;
    margin-bottom: 10px;
}

.warning {
    color: #ffb4b4;
    font-size: 18px;
}

.url {
    margin-top: 25px;
    padding: 15px;
    background: #080b12;
    border-radius: 10px;
    word-break: break-all;
    color: #aaa;
}

.reason {
    text-align: left;
    margin-top: 25px;
}

button {
    margin-top: 30px;
    padding: 14px 30px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    font-size: 16px;
}

.back {
    background: #ffffff;
    color: #111;
}

</style>

</head>

<body>

<div class="card">

    <div class="icon">🚨</div>

    <h1>Website Blocked</h1>

    <p class="warning">
        THEREAT AI detected a high-risk website.
    </p>

    <div class="url" id="url">
        Checking...
    </div>

    <div class="reason">

        <h3>Why was it blocked?</h3>

        <p id="reasons">
            Analyzing threat...
        </p>

        <p>
            🔒 Analysis performed locally by THEREAT AI
        </p>

    </div>

    <button class="back" onclick="history.back()">
        ← Go Back Safely
    </button>

</div>

<script src="blocked.js"></script>

</body>
</html>
